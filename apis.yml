name: Tally Labs
description: >-
  Tally Labs is a Web3 media and entertainment company founded in 2021 and
  headquartered in the United States. It is best known for creating and
  operating Jenkins the Valet, a fictional character and NFT project built
  around Bored Ape Yacht Club #1798, and for the community-generative NFT
  novel "Bored & Dangerous," set in the fictional world of Azurbala and written
  with New York Times bestselling author Neil Strauss. The company builds
  characters, narratives, and interactive storytelling tools intended to let
  creators turn their imaginations into content. Tally Labs raised a $12M seed
  round in May 2022 led by a16z crypto. As a Web3 media/IP company it does not
  publish a public developer API, SDKs, or machine-readable specifications;
  this profile captures its identity and public web surface for the API
  Evangelist network.
